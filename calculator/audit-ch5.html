<script>
const qs=[
{q:"1. 審計準則公報第51號「查核規劃及執行之重大性」，對於查核人員執行重大性之應用，下列敘述何者錯誤？",o:["判斷重大性水準時，查核人員應先決定整體財務報表重大性，亦得進一步分配初步判斷重大性水準至財務報表的各科目","查核人員於執行查核過程中，如發現特定重大交易導致必須修正財務報表重大性時，除了修訂該特定交易之重大性外，亦應考量修正財務報表整體重大性","查核人員於決定執行重大性時，不能僅就當年度之財務報表要素進行評估，以往年度查核所辨認不實表達之性質與範圍，也會影響當年度執行重大性之決定","查核人員於彙總各科目不實表達後，發現不實表達超過財務報表整體重大性，係因某特定科目估計不實表達遠超過該科目執行重大性所致，查核人員得修正財務報表整體重大性"],a:3,e:"課本答案 D。發現彙總不實表達超過整體重大性，不能因此反過來任意提高整體重大性。"},
{q:"2. 查核人員原預估控制風險水準是10%，經執行內部控制測試後評估控制風險水準為25%，則查核人員最好應：",o:["提高可接受查核風險水準","降低可接受查核風險水準","降低固有風險水準","降低可接受偵查風險水準"],a:3,e:"課本答案 D。控制風險提高，為維持整體查核風險，可接受偵查風險應降低。"},
{q:"3. 甲公司主要係從事汽車銷售業務之上市公司，2018、2019、2020年度銷貨收入及稅前淨利如題示。2020年因疫情獲利衰退，若會計師針對2020年度查核決定適當重大性基準，應採何者？",o:["採用2018年、2019年及2020年度稅前淨利之平均數","採用2018年、2019年及2020年度銷貨收入金額之平均數","採用2020年度稅前淨利","採用2020年度銷貨收入金額"],a:0,e:"課本答案 A。當期獲利因特殊情況異常偏低時，可考量正常化後的基準。"},
{q:"4. 下列何種情況最不可能影響對查核風險之判斷？",o:["受查公司即將首次公開發行股票","受查公司未於財務報表揭露關係人交易","受查公司之會計部門主管流動率高","受查公司每兩週即發一次員工薪水"],a:3,e:"課本答案 D。薪資發放頻率本身通常較不直接影響整體查核風險判斷。"},
{q:"5. 針對受查者20X1年12月31日之所有銷貨收入執行認列時點之查核程序，發現一筆目的地交貨交易於20X2年1月3日簽收，但受查公司於20X1年12月31日出貨後即認列收入，則該不實表達為：",o:["實際不實表達","判斷性不實表達","推估不實表達","預期不實表達"],a:0,e:"課本答案 A。交易事實與認列規則明確，屬實際不實表達。"},
{q:"6. 對舞弊預防及偵查程序和相關內部控制制度之建立，下列何者應負主要責任？",o:["管理階層","內部稽核人員","董事會","會計師"],a:0,e:"課本答案 A。舞弊預防與偵查的主要責任在管理階層與治理單位。"},
{q:"7. 有關重大性之敘述，下列何者錯誤？",o:["受查者之股權結構及籌資方式可能會影響整體重大性之基準","重大性之決定屬專業判斷，且該判斷受查核人員對財務報表使用者財務資訊需求之認知所影響","查核人員所選用之基準，攸關之財務資料僅能使用當期之財務狀況、預算或預測","查核人員應於規劃查核工作階段，決定財務報表整體重大性"],a:2,e:"課本答案 C。重大性基準不僅限於當期資料，也可考量其他適當基礎。"},
{q:"8. 下列何種舞弊方式，非屬財務報導舞弊？",o:["不當調整假設或改變會計估計之判斷","使企業就未取得之商品或服務支付款項","偽造或竄改會計紀錄或相關文件","隱匿對財務報表金額有影響之事實"],a:1,e:"課本答案 B。這較屬資產侵占或不當支出，不是典型財務報導舞弊。"},
{q:"9. 質性因素可能影響查核人員對重大性的評估，下列那一項相關之敘述是錯誤的？",o:["假如不實表達在金額上不具重大性，但會產生契約的義務，則可能被認為是重大的","假如不實表達在金額上不具重大性，但會影響財務報表使用者對收益趨勢的認知，則可能被認為是重大的","管理階層從事的財務報表舞弊，仍應依其舞弊金額的大小，判斷是否具有重大性","管理階層及員工從事的舞弊，通常被認為具有不同的重大性"],a:2,e:"課本答案 C。管理階層舞弊即使金額不大，也可能因質性因素具有重大性。"},
{q:"10. 下列何種現象最可能被查核人員認為受查者存有財務報表不實表達之風險？",o:["受查者所屬產業競爭程度低，受查者淨利上升","管理階層於財務報告中揭露企業存有未決訴訟並認列負債準備","受查者交易高度依賴電腦化處理，缺乏書面審計軌跡","期末調整分錄金額重大，且對本期獲利產生重大影響"],a:3,e:"課本答案 D。期末重大調整且顯著影響獲利，是較典型的風險訊號。"},
{q:"11. 有關查核風險與重大性之敘述，下列何者錯誤？",o:["查核人員應辨認及評估重大不實表達風險，以利考量重大性及查核風險","固有風險與偵查風險存有反向關係","控制風險與重大不實表達風險存有反向關係","受查者之重大不實表達風險愈高，查核人員所需取得之查核證據愈多"],a:2,e:"課本答案 C。重大不實表達風險由固有風險與控制風險構成，並非反向關係。"},
{q:"12. 偵查舞弊的技巧及建立反舞弊程序與內部控制制度，大都基於舞弊三角理論。下列何者不是舞弊三角的要素？",o:["心理狀態","機會","誘因及壓力","態度或合理化"],a:0,e:"課本答案 A。舞弊三角為誘因／壓力、機會、態度／合理化。"},
{q:"13. 重大性之設定會受質性因素影響。下列何項質性因素最可能導致查核人員適度提高重大性？",o:["受查者舞弊行為會造成重大後果","受查者不願意配合改正已發現之錯誤","受查者企業近年持續成長獲利","受查者違反借款合約中之流動比率限制"],a:2,e:"課本答案 C。穩定成長獲利相較其他選項，較不會要求降低重大性門檻。"},
{q:"14. 當查核人員複核查核中所發現的未更正不實表達的彙總時，下列查核人員的因應何者較為適當？",o:["要求受查者必須對所有的不實表達編製調整分錄","必須彙總個別非重大不實表達項目，以評估彙整後的金額是否具重大性","須考慮以前年度未更正不實表達對當期財務報表的影響","僅須要考量會影響損益表的不實表達"],a:1,e:"課本答案 B。個別不重大項目仍須累計，評估合計後是否重大。"},
{q:"15. 依審計準則500號「查核證據」之規定，下列敘述何者錯誤？",o:["股票或債券可視為金融工具存在之證明文件，惟檢查此等文件未必可提供有關所有權及價值之查核證據","檢查期後應收款項收現之文件，可能提供與截止有關之查核證據，但無法提供與存在及評價有關之查核證據","某個人或組織可能具有運用模型以估計無可觀察市場之證券公允價值所需專門知識，若受查者採用該專門知識所作之估計以編製財務報表，則該個人或組織即為管理階層專家","若個人或組織僅提供受查者無法取得之非公開交易價格資訊，而受查者於本身之估計方法中採用此資訊，且查核人員以此資訊作為查核證據時，則非屬受查者對管理階層專家之採用"],a:1,e:"課本答案 B。期後收款文件可提供存在與評價證據，也可能與截止有關。"},
{q:"16. 有關財務報表舞弊之敘述，下列何者錯誤？",o:["偵查舞弊主要係受查者治理單位與管理階層之責任","有關降低財務報表可能因舞弊而產生重大不實表達風險之某些特定控制，管理階層不得因不符成本與效益而不予執行","查核人員應合理確信財務報表整體並無因舞弊所導致之重大不實表達","審計準則要求查核人員質疑所取得之資訊及查核證據，是否可能存有因舞弊所導致之重大不實表達"],a:1,e:"課本答案 B。管理階層建立控制時仍可能考量成本效益。"},
{q:"17. 依審計準則315號「辨認並評估重大不實表達風險」之規定，查核人員應辨認並評估導因於舞弊之整體財務報表及個別項目聲明之重大不實表達風險。下列敘述何者錯誤？",o:["存在舞弊風險因子不必然顯示舞弊已發生，因此查核人員不應將導因於舞弊之重大不實表達風險視為顯著風險","存在舞弊風險因子可能顯示存有導因於舞弊之重大不實表達風險","查核人員於辨認並評估導因於舞弊之重大不實表達風險時，應預設假設收入認列存有舞弊風險，並評估哪些收入、交易或聲明之類型可能產生舞弊風險","查核團隊針對受查者財務報表易發生導因於舞弊之重大不實表達之可能方式及項目時，不應考量其以往對管理階層及治理單位係屬誠實及正直之認知"],a:0,e:"課本答案 A。舞弊風險通常應視為顯著風險。"},
{q:"18. 下列敘述與查核人員評估查核過程中所辨認之不實表達相關，何項最不適當？",o:["查核人員應累計查核過程中所辨認之不實表達，惟不實表達若低於顯然微小門檻，則無須加以累計","為評估所累計不實表達之影響，不實表達應區分為實際不實表達、推估不實表達、分類不實表達等三項","查核過程中所累計不實表達之彙總數如接近查核人員所設定之重大性，則查核風險高於原先水準的可能性會增加","除法律禁止者外，查核人員應及時與適當層級之管理階層溝通所累計之全部不實表達，並要求其更正"],a:1,e:"課本答案 B。分類通常不是這裡的三分法；常見為實際、判斷性、推估不實表達。"},
{q:"19. 下列何者最不可能是查核人員因應管理階層踰越控制之風險所採取之查核程序？",o:["測試會計分錄及編製財務報表所做其他調整之適當性","辨認顯著風險之攸關控制並測試其當期執行之有效性","複核管理階層對會計估計所作之判斷是否有偏頗跡象","評估不尋常或非正常營運之重大交易是否具備合理性"],a:1,e:"課本答案 B。這較屬一般風險因應，不是針對管理階層踰越控制最典型的特定程序。"},
{q:"20. 有關查核人員評估不實表達對財務報表之影響，下列敘述何者錯誤？",o:["未更正不實表達不包含顯然微小之不實表達","查核人員於評估不實表達對財務報表之影響前，不得修正規劃階段決定之重大性","即使分類之不實表達超過用以評估其他不實表達之重大性，查核人員仍可能作出就財務報表整體而言該項分類之不實表達非屬重大之結論","應考量以前期間不重大未更正不實表達之累計數對當期財務報表之影響"],a:1,e:"課本答案 B。查核過程中若取得新資訊，重大性可能需要修正。"},
{q:"21. 查核人員為因應管理階層踰越控制之風險，下列何者並非必要的查核程序？",o:["測試會計分錄及編製財務報表所作其他調整之適當性","複核管理階層作會計估計時是否偏頗，並評估造成該偏頗之情況是否顯示存在舞弊之重大不實表達風險","就其所辨認之不尋常或非正常營運之重大交易，評估交易之動機及合理性是否顯示該等交易之進行係用以從事財務報導舞弊或掩飾挪用資產","因應管理階層踰越控制風險之控制，執行控制測試"],a:3,e:"課本答案 D。管理階層踰越控制風險通常以特定實質程序直接因應。"},
{q:"22. 有關財務報導舞弊風險因子，下列何者非屬誘因或壓力？",o:["管理階層透過年報、法人說明會或媒體發布過度樂觀之預期","管理階層為稅負之考量，欲以不當方式降低盈餘","管理階層對股價或獲利趨勢之維持或提高過度關心","管理階層屢次利用重大性之判斷，試圖為不適當之會計處理作解釋"],a:3,e:"課本答案 D。這較接近態度／合理化，而非誘因或壓力。"},
{q:"23. 下列何者屬於查核人員可以控制之風險？",o:["在不考慮內部控制之情況下，某科目餘額或某類交易發生重大不實表達之風險","內部控制未能即時預防或偵出重大不實表達之風險","查核人員執行查核程序後仍未能偵出既存重大不實表達之風險","受查者經營策略無法達成其目標之風險"],a:2,e:"課本答案 C。偵查風險可由查核人員透過程序性質、時間與範圍加以控制。"},
{q:"24. 下列何者屬於公司財務報導舞弊？",o:["會計經理誤將代第三方收取之款項認列為收入，對財務報表影響重大","採購經理向潛在供應商收取顧問費，潛在供應商以交際費入帳","會計經理為達獲利目標，延長機器設備之耐用年限","財務經理以向客戶收取之貨款先支付個人帳單，於發薪日時再以薪水補回"],a:2,e:"課本答案 C。為達獲利目標而故意操弄估計，屬財務報導舞弊。"},
{q:"25. 下列有關重大性之敘述何者錯誤？",o:["如不實表達之個別金額或彙總數可合理預期將影響財務報表使用者之經濟決策，則被認為具有重大性","重大性受不實表達金額或性質之影響","重大性設定的決定涉及專業判斷","執行重大性為低於財務報表整體重大性之金額，其彙總數不得超過財務報表整體重大性"],a:3,e:"課本答案 D。執行重大性不是以『各執行重大性彙總不得超過整體重大性』方式設定。"},
{q:"26. 查核人員對未更正不實表達作成書面紀錄時，下列何者不是其須考量的事項？",o:["未更正不實表達之累計影響","對是否超過特定交易類別、科目餘額或揭露事項之重大性的評估","應確定其與負有管理責任人員間之溝通，已適當告知主管機關","所評估未更正不實表達對關鍵比率或趨勢、法令與合約規定遵循之影響"],a:2,e:"課本答案 C。這不是未更正不實表達紀錄的必要考量。"},
{q:"27. 有關重大性的敘述，下列何者錯誤？",o:["重大性是相對的而非絕對的概念","用於決定重大性最重要的基礎是總資產","質性及量化因素均影響重大性的判斷","管理階層從事的舞弊，即使金額不重大，亦應被認為具重大性"],a:1,e:"課本答案 B。重大性基準需依個案，不是固定以總資產最重要。"},
{q:"28. 查核人員以繼續營業單位之稅前淨利某一百分比作為計算財務報表整體重大性之起點，下列敘述何者不適當？",o:["查核人員受託查核某年度上半年度財務報表查核，於決定重大性時，應以上半年度之財務報表推算為12個月的繼續營業單位稅前淨利計算重大性，以與年度財務報表查核時採用12個月的財務資訊計算重大性一致","查核人員於查核過程中發現實際財務績效與原用以決定財務報表整體重大性之預期財務績效存有重大差異，應修正該重大性","受查者當年度繼續營業單位之稅前淨利較以往年度大幅減少，趨近於損益兩平，查核人員可以採用過去3年之平均數計算重大性","受查者當年度繼續營業單位之稅前淨利為1,000,000，其中包括火災損失500,000，查核人員考量火災損失是當年度之異常項目，為常態化繼續營業單位之稅前淨利以1,500,000計算重大性"],a:0,e:"課本答案 A。中期財報重大性不宜單純年化成12個月來比照年度財報。"},
{q:"29. 查核人員於執行風險評估之查核程序時，下列何者之順序較為適當？①評估固有風險及控制風險 ②訂定可接受之查核風險 ③訂定可接受之偵查風險 ④決定查核之時間、性質及範圍",o:["①②③④","②①③④","①③②④","④③①②"],a:1,e:"課本答案 B。先設定可接受查核風險，再評估固有與控制風險，據以決定可接受偵查風險，最後決定程序。"}
];

function render(){
 const box=document.getElementById("quizBox");box.innerHTML="";document.getElementById("score").textContent="";
 qs.forEach((x,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML="<b>"+x.q+"</b>"+x.o.map((v,j)=>"<label class='option'><input type='radio' name='q"+i+"' value='"+j+"'> ("+String.fromCharCode(65+j)+") "+v+"</label>").join("")+"<div id='exp"+i+"'></div>";box.appendChild(d);});
}
function grade(){
 let s=0,n=0;
 qs.forEach((x,i)=>{const e=document.querySelector("input[name='q"+i+"']:checked");const out=document.getElementById("exp"+i);if(e){n++;if(+e.value===x.a){s++;out.innerHTML="<div class='ok'>✅ 正確｜"+x.e+"</div>";}else{out.innerHTML="<div class='bad'>❌ 正確答案：("+String.fromCharCode(65+x.a)+") "+x.o[x.a]+"<br>"+x.e+"</div>";}}else out.innerHTML="<div class='bad'>⚠️ 未作答｜正確答案：("+String.fromCharCode(65+x.a)+") "+x.o[x.a]+"</div>";});
 document.getElementById("score").textContent="得分："+s+" / "+qs.length+"（已作答 "+n+" 題）";
}
render();
</script>
