<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP 夢引蝴蝶精｜最大傷害／治療計算器</title><link rel="stylesheet" href="theme.css"><style>*{box-sizing:border-box}body{background:#f5f0e8;color:#29211a;font-family:"Microsoft JhengHei",sans-serif;margin:0;padding:16px}.wrap{max-width:690px;margin:auto}.back{display:block;margin-bottom:12px;color:#765324}.hero{background:linear-gradient(125deg,#30251d,#725137,#a87943);color:white;padding:25px 22px 0;border-radius:18px 18px 0 0}.hero h1{margin:0;font-size:27px}.hero p{font-size:13px}.tabs{display:flex;gap:5px;margin-top:20px}.tabs button{flex:1;background:#ffffff20;border:1px solid #ffffff40;border-radius:8px 8px 0 0;padding:12px 4px;color:white;font-weight:bold;cursor:pointer}.tabs button.active{background:#fff;color:#67472d}.body{background:white;padding:22px;border-radius:0 0 18px 18px}.tab{display:none}.tab.active{display:block}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:block;font-size:13px;font-weight:bold}.fields input,.rev-input{display:block;width:100%;padding:12px;border:1px solid #cdbda8;border-radius:9px;margin-top:6px;font-size:18px}.card{background:#fbf5ec;border:1px solid #e7d7bf;border-radius:12px;padding:15px;margin:12px 0}.card small{display:block;color:#806b53}.card strong{display:block;font-size:27px;color:#8d5324;margin:8px 0}.card p,.note{font-size:12px;color:#766756;line-height:1.7}.skill{border:1px solid #e4d7c8;border-radius:9px;padding:12px;margin:12px 0;line-height:1.8}#skills{line-height:1.8;font-size:13px}@media(max-width:480px){.fields{grid-template-columns:1fr}.body{padding:15px}.hero{padding:20px 14px 0}.hero h1{font-size:23px}.tabs button{font-size:12px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← 返回式神首頁</a><header class="hero"><h1>SP 夢引蝴蝶精</h1><p>滿級、滿層・只輸入必要面板</p><div class="tabs"><button class="active" data-tab="calculate">⚔ 計算</button><button data-tab="reverse">↩ 反推</button><button data-tab="skills">📖 技能說明</button></div></header><div class="body"><section class="tab active" id="calculate"><h2>最大傷害／治療量</h2><div class="fields"><label>友方最大生命<input id="hp" type="number" min="0" step="any" inputmode="decimal" placeholder="請輸入友方最大生命"></label><label>治療暴擊傷害 %<input id="cd" type="number" min="0" step="any" inputmode="decimal" placeholder="請輸入治療暴擊傷害 %"></label></div><div class="card"><small>一般友方・基礎治療</small><strong id="out0">─</strong><p>最大生命 × 15%</p></div><div class="card"><small>選中目標・基礎治療</small><strong id="out1">─</strong><p>最大生命 × 30%</p></div><div class="card"><small>選中目標・暴擊治療</small><strong id="out2">─</strong><p>選中目標基礎治療 × 暴擊傷害</p></div><p class="note">以上為技能公式理論值，未計敵方防禦、減傷及實際剩餘生命。以目標已損失生命足夠為前提，實際恢復不超過已損失生命。</p></section><section class="tab" id="reverse"><h2>反推友方最大生命</h2><label>目標「選中目標・基礎治療」<input class="rev-input" id="target" type="number" min="0" step="any" inputmode="decimal"></label><div class="card"><small>所需友方最大生命</small><strong id="needed">─</strong><p>其他面板使用「計算」分頁所輸入的數值；結果向上取整。</p></div></section><section class="tab" id="skills"><h2>技能說明（原頁參考資料）</h2><p>技能文字請以遊戲內說明為準。</p></section></div></main><script>const E=id=>document.getElementById(id),v=id=>Math.max(0,Number(E(id).value)||0),fmt=n=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:2}):'─',out=(id,n)=>E(id).textContent=fmt(n);function calc(){const hp=v('hp');const cd=v('cd');if(!E('hp').value){E('out0').textContent='─';E('out1').textContent='─';E('out2').textContent='─';}out('out0',(hp*.15));out('out1',(hp*.3));out('out2',(hp*.3*cd/100));if(!E('target').value){E('needed').textContent='─';return;}const target=v('target');const coefficient=(1*.3);E('needed').textContent=E('target').value&&coefficient>0?fmt(Math.ceil(target/coefficient)):'─';}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))}));calc();</script></body></html>
