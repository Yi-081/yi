name: Apply calculator theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'calculator/theme.css'
      - 'calculator/apply_theme.py'
      - '.github/workflows/apply-calculator-theme.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply theme links and navigation
        run: python calculator/apply_theme.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator/*.html
          git commit -m "style: apply unified calculator theme"
          git push
